name: Compile ALL PaddleOCR v4 Mobile Models

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PaddleOCR and Tools
      run: |
        pip install paddlepaddle paddlelite paddleocr

    - name: Download and Prepare All Major Languages
      run: |
        python -c "
        from paddleocr import PaddleOCR
        # যে যে ভাষা প্রয়োজন তার একটা লিস্ট (এখানে বাংলা, ইংরেজি, হিন্দি, আরবি, ল্যাটিন/মাল্টিঅ্যাঙ্গুয়েজ দেওয়া হয়েছে)
        languages = ['en', 'bg', 'hi', 'ar', 'latin']
        
        # ডিটেকশন মডেলটি একবার লোড করলেই ডাউনলোড হয়ে যাবে
        ocr_det = PaddleOCR(use_angle_cls=True, lang='en')
        
        # লুপ চালিয়ে সব ভাষার রিকগনিশন মডেল একসাথে ডাউনলোড করা হচ্ছে
        for lang in languages:
            print(f'Downloading model for: {lang}')
            PaddleOCR(use_angle_cls=True, lang=lang)
        "
        
        # কম্পাইল করার জন্য মূল ফোল্ডার তৈরি
        mkdir -p models_to_compile/ch_PP-OCRv4_mobile_det_infer
        
        # ১. ডিটেকশন মডেল কপি ও নাম পরিবর্তন
        cp ~/.paddleocr/whl/det/ch/ch_PP-OCRv4_mobile_det_infer/* ./models_to_compile/ch_PP-OCRv4_mobile_det_infer/ || true
        mv ./models_to_compile/ch_PP-OCRv4_mobile_det_infer/inference.pdmodel ./models_to_compile/ch_PP-OCRv4_mobile_det_infer/model.pdmodel || true
        mv ./models_to_compile/ch_PP-OCRv4_mobile_det_infer/inference.pdiparams ./models_to_compile/ch_PP-OCRv4_mobile_det_infer/model.pdiparams || true

        # ২. সব রিকগনিশন মডেল খুঁজে বের করে কপি ও নাম পরিবর্তন করার অটোমেটিক স্ক্রিপ্ট
        python -c "
        import os, shutil
        base_path = os.path.expanduser('~/.paddleocr/whl/rec')
        dest_base = './models_to_compile'
        
        for root, dirs, files in os.walk(base_path):
            if 'inference.pdmodel' in files:
                folder_name = os.path.basename(root)
                dest_folder = os.path.join(dest_base, folder_name)
                os.makedirs(dest_folder, exist_ok=True)
                
                # ফাইল কপি
                shutil.copy(os.path.join(root, 'inference.pdmodel'), os.path.join(dest_folder, 'model.pdmodel'))
                shutil.copy(os.path.join(root, 'inference.pdiparams'), os.path.join(dest_folder, 'model.pdiparams'))
        "

    - name: Compile All Models to Mobile Format (.nb)
      run: |
        mkdir -p final_mobile_models
        
        # লুপ চালিয়ে সব ফোল্ডারের মডেল অটোমেটিক কম্পাইল করা
        for dir in ./models_to_compile/*/; do
            folder_name=$(basename "$dir")
            # ইনফারেন্স নাম ছোট করে আউটপুট ফাইলের নাম দেওয়া (যেমন: ocr_det_mobile, ch_PP-OCRv4_mobile_rec_infer ইত্যাদি)
            output_name=${folder_name%_infer}
            paddle_lite_opt --model_dir="$dir" --valid_targets=arm --optimize_out="./final_mobile_models/$output_name"
        done

    - name: Upload All Mobile Output Files
      uses: actions/upload-artifact@v4
      with:
        name: paddleocr-v4-all-languages-mobile-models
        path: final_mobile_models/
