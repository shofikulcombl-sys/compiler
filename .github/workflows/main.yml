name: Compile PaddleOCR v4 to Mobile Format

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PaddleLite Compiler
      run: |
        pip install paddlelite

    - name: Download PP-OCRv4 Mobile Models from HuggingFace
      run: |
        # ডিটেকশন মডেলের ফাইল ডাউনলোড এবং ফোল্ডার তৈরি
        mkdir -p ch_PP-OCRv4_mobile_det_infer
        wget -O ch_PP-OCRv4_mobile_det_infer/inference.pdmodel https://huggingface.co/PaddlePaddle/PP-OCRv4_mobile_det/resolve/main/inference.pdmodel
        wget -O ch_PP-OCRv4_mobile_det_infer/inference.pdiparams https://huggingface.co/PaddlePaddle/PP-OCRv4_mobile_det/resolve/main/inference.pdiparams

        # রিকগনিশন মডেলের ফাইল ডাউনলোড এবং ফোল্ডার তৈরি
        mkdir -p en_PP-OCRv4_mobile_rec_infer
        wget -O en_PP-OCRv4_mobile_rec_infer/inference.pdmodel https://huggingface.co/PaddlePaddle/en_PP-OCRv4_mobile_rec/resolve/main/inference.pdmodel
        wget -O en_PP-OCRv4_mobile_rec_infer/inference.pdiparams https://huggingface.co/PaddlePaddle/en_PP-OCRv4_mobile_rec/resolve/main/inference.pdiparams

    - name: Compile to Mobile Format (.nb)
      run: |
        paddle_lite_opt --model_dir=./ch_PP-OCRv4_mobile_det_infer --valid_targets=arm --optimize_out=ocr_det_mobile
        paddle_lite_opt --model_dir=./en_PP-OCRv4_mobile_rec_infer --valid_targets=arm --optimize_out=ocr_rec_mobile

    - name: Upload Mobile Output Files
      uses: actions/upload-artifact@v4
      with:
        name: paddleocr-v4-mobile-models
        path: |
          ocr_det_mobile.nb
          ocr_rec_mobile.nb
