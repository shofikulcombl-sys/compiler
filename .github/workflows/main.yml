name: Compile TOP 10 Languages PaddleOCR v4 Mobile Models

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PaddleOCR and Tools
      run: |
        pip install paddlepaddle paddleocr paddlelite

    - name: Download and Process All 10 Languages (Fixed Paths)
      run: |
        python -c "
        from paddleocr import PaddleOCR
        import os, shutil

        languages = ['en', 'bg', 'hi', 'ar', 'ur', 'ch', 'fa', 'fr', 'es', 'ru']

        print('Downloading Detection Model...')
        PaddleOCR(use_angle_cls=True, lang='en')

        for lang in languages:
            print(f'Downloading Recognition Model for: {lang}')
            try:
                PaddleOCR(use_angle_cls=True, lang=lang)
            except Exception as e:
                print(f'Error downloading {lang}: {e}')

        os.makedirs('./models_to_compile', exist_ok=True)

        # নতুন এবং পুরাতন উভয় পাথেই মডেল খুঁজে বের করা হবে
        possible_base_paths = [
            os.path.expanduser('~/.paddlex/official_models'),
            os.path.expanduser('~/.paddleocr/whl')
        ]

        copied_count = 0
        for base_path in possible_base_paths:
            if not os.path.exists(base_path):
                continue
            print(f'Searching for models in: {base_path}')
            
            for root, dirs, files in os.walk(base_path):
                if 'inference.pdmodel' in files and 'inference.pdiparams' in files:
                    folder_name = os.path.basename(root)
                    # ফোল্ডারের নাম থেকে '_infer' সরিয়ে পরিষ্কার নাম তৈরি করা
                    clean_name = folder_name.replace('_infer', '').replace('_infer', '')
                    dest_folder = os.path.join('./models_to_compile', clean_name)

                    os.makedirs(dest_folder, exist_ok=True)
                    print(f'Copying model from {root} to {dest_folder}')
                    
                    shutil.copy(os.path.join(root, 'inference.pdmodel'), os.path.join(dest_folder, 'inference.pdmodel'))
                    shutil.copy(os.path.join(root, 'inference.pdiparams'), os.path.join(dest_folder, 'inference.pdiparams'))
                    copied_count += 1

        print(f'Total models copied: {copied_count}')
        if copied_count == 0:
            print('ERROR: No models found! Please check PaddleOCR download paths.')
        "

    - name: Debug - Check models_to_compile folder
      run: |
        echo "Models to compile:"
        ls -R models_to_compile || echo "Folder is empty!"

    - name: Compile All 10 Languages to Mobile Format (.nb)
      run: |
        mkdir -p final_output_models
        python -c "
        import os
        from paddlelite.lite import Opt
        import traceback

        model_dir = './models_to_compile'
        output_dir = './final_output_models'

        if os.path.exists(model_dir):
            folders = os.listdir(model_dir)
            print(f'Found folders to compile: {folders}')
            for folder in folders:
                full_path = os.path.join(model_dir, folder)
                if os.path.isdir(full_path):
                    print(f'Compiling: {folder}')
                    model_file = os.path.join(full_path, 'inference.pdmodel')
                    param_file = os.path.join(full_path, 'inference.pdiparams')

                    if not os.path.exists(model_file):
                        print(f'  ERROR: No inference.pdmodel found in {full_path}')
                        print(f'  Files in dir: {os.listdir(full_path)}')
                        continue

                    try:
                        opt = Opt()
                        opt.set_model_file(model_file)
                        opt.set_param_file(param_file)
                        
                        # ARM ও X86 উভয় প্লেস ব্যবহার করা হচ্ছে যাতে Ubuntu সার্ভারে কম্পাইল হয়
                        opt.set_valid_places(['arm', 'arm64', 'x86'])
                        
                        opt.set_optimize_out(os.path.join(output_dir, folder))
                        opt.run()
                        print(f'  Successfully compiled {folder}')
                    except Exception as e:
                        print(f'  Failed to compile {folder}: {e}')
                        traceback.print_exc()
        else:
            print('ERROR: models_to_compile directory does not exist!')
        "

    - name: Debug - Check final output files
      run: |
        echo "Final output files:"
        ls -R final_output_models || echo "No files generated!"

    - name: Upload All 10 Languages Mobile Models
      uses: actions/upload-artifact@v4
      with:
        name: paddleocr-v4-top10-languages-models
        path: final_output_models
