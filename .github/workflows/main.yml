name: Compile PaddleOCR v4 Mobile Models (Lightweight)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PaddleOCR and Tools
      run: |
        pip install paddlepaddle paddleocr paddlelite

    - name: Download ONLY Mobile Models (Lightweight)
      run: |
        python -c "
        from paddleocr import PaddleOCR
        import os, shutil, urllib.request, zipfile
        
        # মোবাইল মডেলের সরাসরি ডাউনলোড লিংক (v4 Mobile)
        MODELS = {
            'det_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/ch/ch_PP-OCRv4_mobile_det_infer.tar',
            'en_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/english/en_PP-OCRv4_mobile_rec_infer.tar',
            'ch_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/chinese/ch_PP-OCRv4_mobile_rec_infer.tar',
            # অন্যান্য ভাষার মোবাইল রিকগনিশন মডেল (আপনার লিস্ট অনুযায়ী)
            'bg_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/multilingual/bulgarian_PP-OCRv4_mobile_rec_infer.tar',
            'hi_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/multilingual/hindi_PP-OCRv4_mobile_rec_infer.tar',
            'ar_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/multilingual/arabic_PP-OCRv4_mobile_rec_infer.tar',
            'ur_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/multilingual/urdu_PP-OCRv4_mobile_rec_infer.tar',
            'fa_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/multilingual/persian_PP-OCRv4_mobile_rec_infer.tar',
            'fr_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/multilingual/french_PP-OCRv4_mobile_rec_infer.tar',
            'es_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/multilingual/spanish_PP-OCRv4_mobile_rec_infer.tar',
            'ru_rec_mobile': 'https://paddleocr.bj.bcebos.com/PP-OCRv4/multilingual/russian_PP-OCRv4_mobile_rec_infer.tar',
        }

        os.makedirs('./models_to_compile', exist_ok=True)
        
        for name, url in MODELS.items():
            print(f'Downloading: {name} from {url}')
            tar_path = f'{name}.tar'
            urllib.request.urlretrieve(url, tar_path)
            
            # আনজিপ করা
            import tarfile
            with tarfile.open(tar_path, 'r') as tar:
                tar.extractall('./models_to_compile')
            
            # ফোল্ডারের নাম পরিবর্তন করে পরিষ্কার করা
            extracted_folder = tar.getmembers()[0].name
            src = os.path.join('./models_to_compile', extracted_folder)
            dst = os.path.join('./models_to_compile', name)
            if os.path.exists(dst):
                shutil.rmtree(dst)
            os.rename(src, dst)
            
            # ফাইলের নাম 'inference.pdmodel' ঠিক রাখা (আগের কম্পাইলার যেন কাজ করে)
            os.rename(os.path.join(dst, 'inference.pdmodel'), os.path.join(dst, 'inference.pdmodel')) # নাম একই থাকে
            os.rename(os.path.join(dst, 'inference.pdiparams'), os.path.join(dst, 'inference.pdiparams'))
            
            os.remove(tar_path)
            print(f'Successfully downloaded and extracted {name}')
        "

    - name: Compile All Mobile Models to .nb
      run: |
        mkdir -p final_output_models
        python -c "
        import os
        from paddlelite.lite import Opt

        model_dir = './models_to_compile'
        output_dir = './final_output_models'

        if os.path.exists(model_dir):
            folders = os.listdir(model_dir)
            for folder in folders:
                full_path = os.path.join(model_dir, folder)
                if os.path.isdir(full_path):
                    print(f'Compiling: {folder}')
                    model_file = os.path.join(full_path, 'inference.pdmodel')
                    param_file = os.path.join(full_path, 'inference.pdiparams')

                    if os.path.exists(model_file):
                        opt = Opt()
                        opt.set_model_file(model_file)
                        opt.set_param_file(param_file)
                        opt.set_valid_places(['arm', 'arm64', 'x86'])
                        opt.set_optimize_out(os.path.join(output_dir, folder))
                        opt.run()
        "

    - name: Upload Mobile Models
      uses: actions/upload-artifact@v4
      with:
        name: paddleocr-v4-mobile-lightweight-models
        path: final_output_models
