name: Compile TOP 10 Languages PaddleOCR v4 Mobile Models

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PaddleOCR and Tools
      run: |
        pip install paddlepaddle paddlelite paddleocr

    - name: Download and Process All 10 Languages
      run: |
        python -c "
        from paddleocr import PaddleOCR
        import os, shutil
        
        # প্রধান ১০টি ভাষার লিস্ট (কোড সহ)
        languages = ['en', 'bg', 'hi', 'ar', 'ur', 'ch', 'fa', 'fr', 'es', 'ru']
        
        # ডিটেকশন মডেলটি ডাউনলোড করা হচ্ছে
        print('Downloading Detection Model...')
        PaddleOCR(use_angle_cls=True, lang='en')
        
        # লুপ চালিয়ে সবগুলো রিকগনিশন মডেল অফিশিয়াল সোর্স থেকে ডাউনলোড
        for lang in languages:
            print(f'Downloading Recognition Model for: {lang}')
            try:
                PaddleOCR(use_angle_cls=True, lang=lang)
            except Exception as e:
                print(f'Error downloading {lang}: {e}')
        
        # কম্পাইলারের পাথের সুবিধার জন্য সব ফাইল একসাথে গোছানো
        os.makedirs('./models_to_compile', exist_ok=True)
        
        # ১. ডিটেকশন মডেল ফোল্ডার তৈরি ও রিনেম
        det_src = os.path.expanduser('~/.paddleocr/whl/det/ch/ch_PP-OCRv4_mobile_det_infer')
        det_dst = './models_to_compile/ocr_det_mobile'
        if os.path.exists(det_src):
            shutil.copytree(det_src, det_dst)
            os.rename(os.path.join(det_dst, 'inference.pdmodel'), os.path.join(det_dst, 'model.pdmodel'))
            os.rename(os.path.join(det_dst, 'inference.pdiparams'), os.path.join(det_dst, 'model.pdiparams'))

        # ২. রিকগনিশন মডেলগুলো অটোমেটিক খুঁজে বের করে কপি ও রিনেম করা
        rec_base_path = os.path.expanduser('~/.paddleocr/whl/rec')
        for root, dirs, files in os.walk(rec_base_path):
            if 'inference.pdmodel' in files:
                folder_name = os.path.basename(root)
                # ইনফারেন্স ফোল্ডারের নাম ছোট করে আউটপুট ফোল্ডার তৈরি (যেমন: en_PP-OCRv4_mobile_rec)
                clean_name = folder_name.replace('_infer', '')
                dest_folder = os.path.join('./models_to_compile', clean_name)
                
                os.makedirs(dest_folder, exist_ok=True)
                shutil.copy(os.path.join(root, 'inference.pdmodel'), os.path.join(dest_folder, 'model.pdmodel'))
                shutil.copy(os.path.join(root, 'inference.pdiparams'), os.path.join(dest_folder, 'model.pdiparams'))
        "

    - name: Compile All 10 Languages to Mobile Format (.nb)
      run: |
        mkdir -p final_output_models
        
        # models_to_compile ফোল্ডারের ভেতরের সব মডেলকে লুপ চালিয়ে সাকসেসফুলি কম্পাইল করা
        for dir in ./models_to_compile/*/; do
            if [ -d "$dir" ]; then
                folder_name=$(basename "$dir")
                echo "Compiling: $folder_name"
                paddle_lite_opt --model_dir="$dir" --valid_targets=arm --optimize_out="./final_output_models/$folder_name" || true
            fi
        done

    - name: Upload All 10 Languages Mobile Models
      uses: actions/upload-artifact@v4
      with:
        name: paddleocr-v4-top10-languages-models
        path: final_output_models/
