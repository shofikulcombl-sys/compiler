name: Compile PaddleOCR v4 to Mobile Format

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PaddleOCR and Tools
      run: |
        pip install paddlepaddle paddlelite paddleocr

    - name: Download PP-OCRv4 Mobile Models via Python Default Downloader
      run: |
        python -c "
        from paddleocr import PaddleOCR
        # ডিফল্টভাবে রান করালে এটি নিজেই v4 মোবাইল মডেলগুলো ব্যাকগ্রাউন্ডে ডাউনলোড করে নেবে
        ocr = PaddleOCR(use_angle_cls=True, lang='en')
        "
        # ডাউনলোড হওয়া ফাইলগুলো খুঁজে বের করে আমাদের প্রজেক্ট ফোল্ডারে কপি করা
        mkdir -p ch_PP-OCRv4_mobile_det_infer en_PP-OCRv4_mobile_rec_infer
        
        # ডিফল্ট ডাউনলোড পাথ থেকে ফাইলগুলো কপি করা
        cp ~/.paddleocr/whl/det/ch/ch_PP-OCRv4_mobile_det_infer/* ./ch_PP-OCRv4_mobile_det_infer/ || true
        cp ~/.paddleocr/whl/rec/en/en_PP-OCRv4_mobile_rec_infer/* ./en_PP-OCRv4_mobile_rec_infer/ || true

    - name: Compile to Mobile Format (.nb)
      run: |
        paddle_lite_opt --model_dir=./ch_PP-OCRv4_mobile_det_infer --valid_targets=arm --optimize_out=ocr_det_mobile
        paddle_lite_opt --model_dir=./en_PP-OCRv4_mobile_rec_infer --valid_targets=arm --optimize_out=ocr_rec_mobile

    - name: Upload Mobile Output Files
      uses: actions/upload-artifact@v4
      with:
        name: paddleocr-v4-mobile-models
        path: |
          ocr_det_mobile.nb
          ocr_rec_mobile.nb
